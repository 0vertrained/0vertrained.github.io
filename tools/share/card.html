<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Share picture</title>
  <!-- The picture a link to a case study unfolds into: 1200 × 630, drawn by the browser from the site's own
       fonts and screenshots. build.cjs opens this page once per project and saves what it shows. -->
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("../../assets/fonts/archivo.woff2") format("woff2");
      font-weight: 100 900;
      font-stretch: 62% 125%;
    }

    html,
    body {
      margin: 0;
    }

    body {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #edefea;
      color: #17212b;
      font-family: "Archivo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* One size for the four names, set so the longest, 0VERTRAINED, spans the card. */
    h1 {
      position: absolute;
      left: 64px;
      top: 52px;
      margin: 0;
      font-size: 112px;
      font-weight: 820;
      font-stretch: 125%;
      line-height: 0.92;
      letter-spacing: -0.022em;
      white-space: nowrap;
    }

    .kind {
      position: absolute;
      left: 66px;
      top: 196px;
      width: 430px;
      margin: 0;
      color: #4a5560;
      font-size: 31px;
      font-weight: 500;
      line-height: 1.24;
      text-wrap: balance;
    }

    .by {
      position: absolute;
      left: 66px;
      bottom: 54px;
      margin: 0;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.3;
    }

    .by span {
      display: block;
      color: #4a5560;
      font-weight: 500;
    }

    /* The product runs off the right and bottom edges, so it is as large as the card allows. */
    .shot {
      position: absolute;
      left: 560px;
      top: 210px;
      width: 900px;
      border-radius: 14px 0 0 0;
      box-shadow: 0 2px 4px rgb(16 22 30 / 0.1), 0 30px 60px -20px rgb(16 22 30 / 0.45);
      outline: 1px solid rgb(23 33 43 / 0.14);
    }

    .phones {
      position: absolute;
      left: 560px;
      top: 206px;
      display: flex;
      gap: 26px;
    }

    .phones img {
      width: 190px;
      border-radius: 22px;
      background: #f8f7f3;
      box-shadow: 0 2px 4px rgb(16 22 30 / 0.1), 0 30px 60px -20px rgb(16 22 30 / 0.45);
      outline: 1px solid rgb(23 33 43 / 0.14);
    }
  </style>
</head>
<body>
  <h1 data-title></h1>
  <p class="kind" data-kind></p>
  <p class="by">A case study by Rami <span>0vertrained.github.io</span></p>
  <div data-product></div>
  <script>
    // ?title=…&kind=…&shots=<path from the site's root>[,<path>…][&width=<px>]; more than one shot is a row of
    // phone screens, and width sets how wide a single screenshot is drawn (900 unless given).
    const query = new URLSearchParams(location.search);
    document.querySelector("[data-title]").textContent = query.get("title") || "";
    document.querySelector("[data-kind]").textContent = query.get("kind") || "";
    const shots = (query.get("shots") || "").split(",").filter(Boolean);
    const product = document.querySelector("[data-product]");
    if (shots.length > 1) product.className = "phones";
    for (const path of shots) {
      const image = new Image();
      image.src = `../../${path}`;
      if (shots.length === 1) {
        image.className = "shot";
        if (query.get("width")) image.style.width = `${Number(query.get("width"))}px`;
      }
      product.append(image);
    }
  </script>
</body>
</html>
